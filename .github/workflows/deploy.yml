# Déploiement automatique au push sur main.
# Configure les secrets dans GitHub : Settings → Secrets and variables → Actions.

name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DIRECTUS_EMAIL: ${{ secrets.DIRECTUS_ADMIN_EMAIL }}
          DIRECTUS_PASSWORD: ${{ secrets.DIRECTUS_ADMIN_PASSWORD }}
        run: |
          echo "$SSH_PRIVATE_KEY" > key.pem
          chmod 600 key.pem
          ssh -o StrictHostKeyChecking=no -i key.pem "$SSH_USER@$SSH_HOST" \
            "cd $DEPLOY_PATH && git pull origin main && git lfs pull && npm ci && docker compose up -d --build && sleep 25 && docker compose exec -e DIRECTUS_URL=http://directus:8055 -e DIRECTUS_EMAIL='$DIRECTUS_EMAIL' -e DIRECTUS_PASSWORD='$DIRECTUS_PASSWORD' web node /backend/apply-schema.js && docker compose exec -w /workspace -e DIRECTUS_URL=http://directus:8055 -e DIRECTUS_EMAIL='$DIRECTUS_EMAIL' -e DIRECTUS_PASSWORD='$DIRECTUS_PASSWORD' web node /backend/import-profile-posts.js"
          rm -f key.pem
